[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hookfinder"
version = "0.2.0"
description = "Find the 30 seconds that hook you — explainable hook/chorus detection for preview clips, built on librosa."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "Chiranjeev", email = "chiranr19@gmail.com" }]
keywords = [
    "music-information-retrieval",
    "hook-detection",
    "chorus-detection",
    "audio-analysis",
    "preview-clips",
    "librosa",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
]
dependencies = [
    "librosa>=0.10",
    "numpy>=1.22",
    "soundfile>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
hookfinder = "hookfinder.cli:main"

[project.urls]
Homepage = "https://github.com/chiranr19/hookfinder"
Repository = "https://github.com/chiranr19/hookfinder"
Issues = "https://github.com/chiranr19/hookfinder/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/hookfinder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
